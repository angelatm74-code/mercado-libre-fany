<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Recomendaciones - Mercado Libre Fany</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdance, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 20px 0;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .auth-section {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .auth-section input {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            margin-right: 10px;
            font-size: 1em;
        }

        .auth-btn {
            background: #2a5298;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .auth-btn:hover {
            background: #1e3c72;
        }

        .logout-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            float: right;
        }

        .logout-btn:hover {
            background: #cc0000;
        }

        .search-container {
            margin-bottom: 30px;
        }

        .search-input {
            width: 100%;
            padding: 15px 20px;
            font-size: 1em;
            border: none;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            transform: scale(1.02);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .product-card a {
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .product-image-container {
            width: 100%;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            overflow: hidden;
        }

        .product-image {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        .product-info {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-name {
            font-size: 1.1em;
            font-weight: bold;
            color: #1e3c72;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .product-card:hover .product-name {
            color: #2a5298;
        }

        .product-actions {
            display: flex;
            gap: 5px;
            padding: 10px;
        }

        .edit-btn, .delete-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .edit-btn {
            background: #4CAF50;
            color: white;
        }

        .edit-btn:hover {
            background: #388E3C;
        }

        .delete-btn {
            background: #ff4444;
            color: white;
        }

        .delete-btn:hover {
            background: #cc0000;
        }

        .empty-message {
            text-align: center;
            color: white;
            padding: 40px 20px;
            font-size: 1.2em;
        }

        .add-product-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-top: 40px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .add-product-section h2 {
            color: #1e3c72;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #2a5298;
        }

        .add-btn {
            background: #2a5298;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1em;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .add-btn:hover {
            background: #1e3c72;
            transform: scale(1.05);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: white;
            margin: 10% auto;
            padding: 30px;
            border-radius: 15px;
            width: 80%;
            max-width: 500px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover,
        .close:focus {
            color: black;
        }

        .modal h2 {
            color: #1e3c72;
            margin-bottom: 20px;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 1.8em;
            }

            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }

            .product-image-container {
                height: 180px;
            }

            .add-product-section {
                padding: 20px;
            }

            .product-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛒 Mis Recomendaciones</h1>
            <p>Mercado Libre - Enlaces de afiliados</p>
        </header>

        <div class="auth-section" id="authSection">
            <input type="password" id="passwordInput" placeholder="Ingresa contraseña para editar" autocomplete="off">
            <button class="auth-btn" onclick="login()">Acceder</button>
            <span id="authStatus" style="margin-left: 20px; color: #999;"></span>
        </div>

        <button class="logout-btn hidden" id="logoutBtn" onclick="logout()">Cerrar Sesión</button>

        <div class="search-container">
            <input 
                type="text" 
                id="searchInput" 
                class="search-input" 
                placeholder="🔍 Busca un producto..."
                autocomplete="off"
            >
        </div>

        <div id="productsContainer" class="products-grid"></div>

        <div id="emptyMessage" class="empty-message" style="display: none;">
            No hay productos aún. ¡Agrega algunos!
        </div>

        <div class="add-product-section hidden" id="addProductSection">
            <h2>➕ Agregar Nuevo Producto</h2>
            <form id="productForm">
                <div class="form-group">
                    <label for="productName">Nombre del Producto:</label>
                    <input 
                        type="text" 
                        id="productName" 
                        placeholder="Ej: Taladro DeWalt" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="productImage">URL de la Imagen (Google Drive, Imgur, etc):</label>
                    <input 
                        type="url" 
                        id="productImage" 
                        placeholder="Ej: https://i.imgur.com/..." 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="productLink">Link de Afiliado (Mercado Libre):</label>
                    <input 
                        type="url" 
                        id="productLink" 
                        placeholder="Ej: https://mercadolibre.com/..." 
                        required
                    >
                </div>

                <button type="submit" class="add-btn">Agregar Producto</button>
            </form>
        </div>
    </div>

    <!-- Modal para editar -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeEditModal()">&times;</span>
            <h2>✏️ Editar Producto</h2>
            <form id="editForm">
                <div class="form-group">
                    <label for="editProductName">Nombre del Producto:</label>
                    <input type="text" id="editProductName" required>
                </div>

                <div class="form-group">
                    <label for="editProductImage">URL de la Imagen:</label>
                    <input type="url" id="editProductImage" required>
                </div>

                <div class="form-group">
                    <label for="editProductLink">Link de Afiliado:</label>
                    <input type="url" id="editProductLink" required>
                </div>

                <button type="submit" class="add-btn">Guardar Cambios</button>
            </form>
        </div>
    </div>

    <script>
        const PASSWORD = "fany123"; // Cambia esto por una contraseña segura
        let isLoggedIn = false;
        let editingIndex = -1;

        // Cargar productos desde localStorage
        function loadProducts() {
            const stored = localStorage.getItem('mlProducts');
            return stored ? JSON.parse(stored) : [];
        }

        // Guardar productos en localStorage
        function saveProducts(products) {
            localStorage.setItem('mlProducts', JSON.stringify(products));
        }

        // Login
        function login() {
            const password = document.getElementById('passwordInput').value;
            if (password === PASSWORD) {
                isLoggedIn = true;
                document.getElementById('authSection').innerHTML = '<span style="color: #4CAF50; font-weight: bold;">✓ Modo Editor Activado</span>';
                document.getElementById('logoutBtn').classList.remove('hidden');
                document.getElementById('addProductSection').classList.remove('hidden');
                document.getElementById('passwordInput').value = '';
                displayProducts(loadProducts());
            } else if (password) {
                alert('Contraseña incorrecta');
                document.getElementById('passwordInput').value = '';
            }
        }

        // Logout
        function logout() {
            isLoggedIn = false;
            document.getElementById('authSection').innerHTML = '<input type="password" id="passwordInput" placeholder="Ingresa contraseña para editar" autocomplete="off"><button class="auth-btn" onclick="login()">Acceder</button><span id="authStatus" style="margin-left: 20px; color: #999;"></span>';
            document.getElementById('logoutBtn').classList.add('hidden');
            document.getElementById('addProductSection').classList.add('hidden');
            document.getElementById('passwordInput').value = '';
            displayProducts(loadProducts());
        }

        // Mostrar productos
        function displayProducts(products) {
            const container = document.getElementById('productsContainer');
            const emptyMessage = document.getElementById('emptyMessage');

            if (products.length === 0) {
                container.innerHTML = '';
                emptyMessage.style.display = 'block';
                return;
            }

            emptyMessage.style.display = 'none';
            container.innerHTML = products.map((product, index) => `
                <div class="product-card">
                    <a href="${product.link}" target="_blank" rel="noopener noreferrer">
                        <div class="product-image-container">
                            <img src="${product.image}" alt="${product.name}" class="product-image" onerror="this.src='https://via.placeholder.com/200?text=Imagen+no+disponible'">
                        </div>
                        <div class="product-info">
                            <div class="product-name">${product.name}</div>
                        </div>
                    </a>
                    ${isLoggedIn ? `
                        <div class="product-actions">
                            <button type="button" onclick="openEditModal(${index})" class="edit-btn">✏️ Editar</button>
                            <button type="button" onclick="deleteProduct(${index})" class="delete-btn">🗑️ Eliminar</button>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        // Agregar producto
        document.getElementById('productForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('productName').value;
            const image = document.getElementById('productImage').value;
            const link = document.getElementById('productLink').value;

            const products = loadProducts();
            products.push({ name, image, link });
            saveProducts(products);

            // Limpiar formulario
            this.reset();
            displayProducts(products);
            document.getElementById('searchInput').value = '';
        });

        // Abrir modal de edición
        function openEditModal(index) {
            editingIndex = index;
            const products = loadProducts();
            const product = products[index];

            document.getElementById('editProductName').value = product.name;
            document.getElementById('editProductImage').value = product.image;
            document.getElementById('editProductLink').value = product.link;

            document.getElementById('editModal').style.display = 'block';
        }

        // Cerrar modal de edición
        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
            editingIndex = -1;
        }

        // Guardar cambios
        document.getElementById('editForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const products = loadProducts();
            products[editingIndex] = {
                name: document.getElementById('editProductName').value,
                image: document.getElementById('editProductImage').value,
                link: document.getElementById('editProductLink').value
            };

            saveProducts(products);
            displayProducts(products);
            closeEditModal();
        });

        // Eliminar producto
        function deleteProduct(index) {
            if (confirm('¿Estás seguro de que quieres eliminar este producto?')) {
                const products = loadProducts();
                products.splice(index, 1);
                saveProducts(products);
                displayProducts(products);
            }
        }

        // Buscador en tiempo real
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            let products = loadProducts();

            if (searchTerm) {
                products = products.filter(product => 
                    product.name.toLowerCase().includes(searchTerm)
                );
            }

            displayProducts(products);
        });

        // Cerrar modal si se clickea afuera
        window.onclick = function(event) {
            const modal = document.getElementById('editModal');
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }

        // Inicializar
        displayProducts(loadProducts());
    </script>
</body>
</html>
