<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Recomendaciones - Mercado Libre Fany</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 20px 0;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .search-container {
            margin-bottom: 30px;
        }

        .search-input {
            width: 100%;
            padding: 15px 20px;
            font-size: 1em;
            border: none;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            transform: scale(1.02);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .product-card a {
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #f0f0f0;
        }

        .product-info {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-name {
            font-size: 1.1em;
            font-weight: bold;
            color: #1e3c72;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .product-card:hover .product-name {
            color: #2a5298;
        }

        .empty-message {
            text-align: center;
            color: white;
            padding: 40px 20px;
            font-size: 1.2em;
        }

        .add-product-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-top: 40px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .add-product-section h2 {
            color: #1e3c72;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #2a5298;
        }

        .add-btn {
            background: #2a5298;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1em;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .add-btn:hover {
            background: #1e3c72;
            transform: scale(1.05);
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 1.8em;
            }

            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }

            .add-product-section {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛒 Mis Recomendaciones</h1>
            <p>Mercado Libre - Enlaces de afiliados</p>
        </header>

        <div class="search-container">
            <input 
                type="text" 
                id="searchInput" 
                class="search-input" 
                placeholder="🔍 Busca un producto..."
                autocomplete="off"
            >
        </div>

        <div id="productsContainer" class="products-grid"></div>

        <div id="emptyMessage" class="empty-message" style="display: none;">
            No hay productos aún. ¡Agrega algunos!
        </div>

        <div class="add-product-section">
            <h2>➕ Agregar Nuevo Producto</h2>
            <form id="productForm">
                <div class="form-group">
                    <label for="productName">Nombre del Producto:</label>
                    <input 
                        type="text" 
                        id="productName" 
                        placeholder="Ej: Taladro DeWalt" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="productImage">URL de la Imagen:</label>
                    <input 
                        type="url" 
                        id="productImage" 
                        placeholder="Ej: https://ejemplo.com/imagen.jpg" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="productLink">Link de Afiliado (Mercado Libre):</label>
                    <input 
                        type="url" 
                        id="productLink" 
                        placeholder="Ej: https://mercadolibre.com/..." 
                        required
                    >
                </div>

                <button type="submit" class="add-btn">Agregar Producto</button>
            </form>
        </div>
    </div>

    <script>
        // Cargar productos desde localStorage
        function loadProducts() {
            const stored = localStorage.getItem('mlProducts');
            return stored ? JSON.parse(stored) : [];
        }

        // Guardar productos en localStorage
        function saveProducts(products) {
            localStorage.setItem('mlProducts', JSON.stringify(products));
        }

        // Mostrar productos
        function displayProducts(products) {
            const container = document.getElementById('productsContainer');
            const emptyMessage = document.getElementById('emptyMessage');

            if (products.length === 0) {
                container.innerHTML = '';
                emptyMessage.style.display = 'block';
                return;
            }

            emptyMessage.style.display = 'none';
            container.innerHTML = products.map((product, index) => `
                <div class="product-card">
                    <a href="${product.link}" target="_blank" rel="noopener noreferrer">
                        <img src="${product.image}" alt="${product.name}" class="product-image" onerror="this.src='https://via.placeholder.com/200?text=Imagen+no+disponible'">
                        <div class="product-info">
                            <div class="product-name">${product.name}</div>
                        </div>
                    </a>
                    <button onclick="deleteProduct(${index})" style="background: #ff4444; color: white; border: none; padding: 8px; cursor: pointer; font-weight: bold;">Eliminar</button>
                </div>
            `).join('');
        }

        // Agregar producto
        document.getElementById('productForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('productName').value;
            const image = document.getElementById('productImage').value;
            const link = document.getElementById('productLink').value;

            const products = loadProducts();
            products.push({ name, image, link });
            saveProducts(products);

            // Limpiar formulario
            this.reset();
            displayProducts(products);
            document.getElementById('searchInput').value = '';
        });

        // Eliminar producto
        function deleteProduct(index) {
            const products = loadProducts();
            products.splice(index, 1);
            saveProducts(products);
            displayProducts(products);
        }

        // Buscador en tiempo real
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            let products = loadProducts();

            if (searchTerm) {
                products = products.filter(product => 
                    product.name.toLowerCase().includes(searchTerm)
                );
            }

            displayProducts(products);
        });

        // Inicializar
        displayProducts(loadProducts());
    </script>
</body>
</html>
